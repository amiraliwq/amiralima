name: Build and deploy React site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Vite source index
        run: cp index.source.html index.html

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Sync built site to main branch
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          for f in admin-enhancements.js payment-widget.js payment-gate.js ai-assistant.js vivid-theme.css; do
            if [ -f "dist/$f" ]; then cp "dist/$f" "./$f"; elif [ -f "$f" ]; then cp "$f" "./$f"; fi
          done
          cp dist/index.html ./index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets admin-enhancements.js payment-widget.js payment-gate.js ai-assistant.js vivid-theme.css
          if git diff --cached --quiet; then
            echo "No built-site changes to commit."
          else
            git commit -m "chore: sync built site"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
