<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>امیرعلی مارکت — نمونه دیجی‌کالا</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="logo">امیرعلی‌مارکت</div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="جستجو در محصولات..." />
      </div>
      <div class="actions">
        <button id="openUploadBtn" class="btn">ثبت محصول جدید</button>
      </div>
    </div>
  </header>

  <main class="container main-grid">
    <aside class="sidebar">
      <h3>دسته‌ها</h3>
      <ul>
        <li>همه</li>
        <li>الکترونیک</li>
        <li>کتاب</li>
        <li>خانه و آشپزخانه</li>
        <li>پوشاک</li>
      </ul>
    </aside>

    <section class="content">
      <div class="hero">
        <h1>به فروشگاه نمونه خوش آمدید</h1>
        <p>محصولات خود را اضافه کنید، عکس آپلود کنید و کارت محصول را ببینید.</p>
      </div>

      <div class="products" id="productsGrid">
        <!-- کارت‌های محصول اینجا اضافه می‌شود -->
      </div>
    </section>
  </main>

  <!-- Modal آپلود -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-dialog">
      <header class="modal-header">
        <h2>ثبت محصول جدید</h2>
        <button id="closeUploadBtn" class="close">&times;</button>
      </header>

      <form id="uploadForm" class="upload-form">
        <label class="field">
          <span>نام محصول</span>
          <input id="productName" type="text" required placeholder="مثال: هندزفری بی‌سیم" />
        </label>

        <label class="field">
          <span>قیمت (تومان)</span>
          <input id="productPrice" type="number" min="0" required placeholder="مثال: ۲۵۰۰۰۰" />
        </label>

        <label class="field">
          <span>عکس محصول</span>
          <input id="productImage" type="file" accept="image/*" />
        </label>

        <div class="preview" id="imagePreview">
          <span class="hint">پیش‌نمایش عکس اینجا ظاهر می‌شود</span>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn primary">ثبت و اضافه کردن</button>
          <button type="button" id="cancelUpload" class="btn">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    &copy; ۲۰۲۵ امیرعلی مارکت — نسخه نمونه
  </footer>

  <script src="app.js"></script>
</body>
</html>
