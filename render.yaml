services:
  - type: web
    name: amirali-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/launcher.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: amiralirazi1391
      - key: ADMIN_PHONE
        value: '09364601110'
      - key: FRONTEND_URL
        value: https://amiraliwq.github.io
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DATABASE_SSL
        value: 'true'
